<!--
  Panel markup. The build inlines styles.css and the bundled script at the two
  placeholders below: Orca's panel CSP blocks every external file.
  Orca prepends its own <!doctype>/<html>/<head> shell, so start at <body>.
  Icons are inline Lucide SVGs (Orca's own icon set).
-->
<!-- @inline-styles -->
<body>
  <header class="header">
    <div class="header-text">
      <h3>E2E Cucumber</h3>
      <p id="summary" class="muted"></p>
    </div>
    <button id="edit-projects" class="icon-button" title="Editar projects.json" aria-label="Editar projects.json">
      <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
    </button>
    <button id="refresh" class="icon-button" title="Reescanear features" aria-label="Reescanear features">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></svg>
    </button>
  </header>

  <label class="field">
    <svg viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M7 12h10" /><path d="M10 18h4" /></svg>
    <input id="query" type="search" placeholder="Buscar feature, escenario o @tag" aria-label="Buscar features" />
  </label>

  <script id="panel-data" type="application/json">{}</script>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty muted"></p>
  <p id="status" class="status" role="status"></p>
  <p class="hint muted">Proyectos: ⚙ arriba o paleta de comandos → <b>Cucumber</b></p>

  <div id="terminal-menu" class="menu" role="menu" aria-labelledby="terminal-menu-label" hidden>
    <div id="terminal-menu-label" class="menu-label"></div>
    <div id="terminal-menu-items"></div>
  </div>

  <!-- Popup icons (see terminalIcon, ITEM_MENU): Lucide terminal/bot/plus/pencil/play/eye + simplified brand marks. -->
  <template id="icon-terminal"><svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5" /><line x1="12" x2="20" y1="19" y2="19" /></svg></template>
  <template id="icon-bot"><svg viewBox="0 0 24 24"><path d="M12 8V4H8" /><rect width="16" height="12" x="4" y="8" rx="2" /><path d="M2 14h2" /><path d="M20 14h2" /><path d="M15 13v2" /><path d="M9 13v2" /></svg></template>
  <template id="icon-edit"><svg viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg></template>
  <template id="icon-run"><svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" /></svg></template>
  <template id="icon-eye"><svg viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></svg></template>
  <template id="icon-new"><svg viewBox="0 0 24 24"><path d="M5 12h14" /><path d="M12 5v14" /></svg></template>
  <template id="icon-html"><svg viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="m10 13-2 2 2 2" /><path d="m14 17 2-2-2-2" /></svg></template>
  <template id="icon-claude"><svg viewBox="0 0 24 24" class="icon-claude"><path d="M12 3v18" /><path d="M3 12h18" /><path d="m5.6 5.6 12.8 12.8" /><path d="m18.4 5.6-12.8 12.8" /></svg></template>
  <template id="icon-codex"><svg viewBox="0 0 24 24" class="icon-codex"><path d="M12 3 4.2 7.5v9L12 21l7.8-4.5v-9Z" /><path d="M12 12 4.2 7.5" /><path d="M12 12v9" /><path d="m12 12 7.8-4.5" /></svg></template>
  <template id="icon-gemini"><svg viewBox="0 0 24 24" class="icon-gemini"><path d="M12 2c0 5.5 4.5 10 10 10-5.5 0-10 4.5-10 10 0-5.5-4.5-10-10-10 5.5 0 10-4.5 10-10Z" /></svg></template>

  <template id="menu-item-template">
    <button class="menu-item" role="menuitem">
      <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5" /><line x1="12" x2="20" y1="19" y2="19" /></svg>
      <span class="menu-item-label"></span>
      <span class="menu-item-hint"></span>
    </button>
  </template>

  <template id="project-template">
    <li class="project">
      <div class="project-head">
        <span class="project-text">
          <span class="project-name"></span>
          <span class="project-meta"></span>
        </span>
        <button class="icon-button run-all" aria-label="Ejecutar todo">
          <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" /></svg>
        </button>
      </div>
      <ul class="features"></ul>
    </li>
  </template>

  <template id="folder-template">
    <li class="folder">
      <div class="folder-head">
        <button class="row folder-row">
          <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
          <svg class="folder-icon" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></svg>
          <span class="row-text"><span class="row-title"></span></span>
          <span class="folder-count"></span>
        </button>
        <button class="icon-button run-folder" aria-label="Ejecutar carpeta">
          <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" /></svg>
        </button>
        <button class="icon-button more" aria-label="Más acciones">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></svg>
        </button>
      </div>
      <ul class="tree"></ul>
    </li>
  </template>

  <template id="feature-template">
    <li class="feature">
      <div class="feature-head">
        <button class="row feature-row">
          <svg viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></svg>
          <span class="row-text">
            <span class="row-title"></span>
            <span class="row-preview"></span>
          </span>
        </button>
        <button class="icon-button run" aria-label="Ejecutar">
          <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" /><rect class="stop" x="5" y="5" width="14" height="14" rx="2" /></svg>
        </button>
        <button class="icon-button toggle" aria-label="Colapsar escenarios">
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
        </button>
        <button class="icon-button more" aria-label="Más acciones">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></svg>
        </button>
      </div>
      <ul class="scenarios"></ul>
    </li>
  </template>

  <template id="scenario-template">
    <li class="scenario">
      <div class="scenario-head">
        <button class="row scenario-row">
          <span class="row-text">
            <span class="row-title"></span>
            <span class="row-preview"></span>
          </span>
        </button>
        <button class="icon-button run" aria-label="Ejecutar">
          <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" /><rect class="stop" x="5" y="5" width="14" height="14" rx="2" /></svg>
        </button>
        <button class="icon-button see-error" title="Ver error" aria-label="Ver error" hidden>
          <svg viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg>
        </button>
        <button class="icon-button toggle" aria-label="Ver definición">
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
        </button>
        <button class="icon-button more" aria-label="Más acciones">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></svg>
        </button>
      </div>
      <pre class="gherkin" hidden></pre>
      <div class="errors" hidden></div>
    </li>
  </template>
  <!-- @inline-script -->
</body>
